name: Azure Static Web Apps CI/CD (demo-contingencia-local)

# Standalone contingency deploy: serves a frozen local snapshot of the real
# data instead of depending on Azure Blob Storage env vars. Independent of
# the main azure-static-web-apps.yml workflow — do not merge this branch
# into dev/main. Delete this file once the real Azure env vars are confirmed
# working end to end.
on:
  push:
    branches:
      - demo-contingencia-local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy (demo)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_DEV_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_DEV_ENVIRONMENT }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_ISLAND_047A61710 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          api_location: ''
          output_location: ''
          skip_app_build: true
