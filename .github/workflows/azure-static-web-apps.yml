name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - dev
      - storybook
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── Build & Deploy ───────────────────────────────────────
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Storybook
        if: github.ref_name == 'storybook'
        run: npm run build-storybook

      - name: Build app
        if: github.ref_name != 'storybook'
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_DEV_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_DEV_ENVIRONMENT }}
          NEXT_PUBLIC_AZURE_STORAGE_ACCOUNT_URL: ${{ secrets.NEXT_PUBLIC_AZURE_STORAGE_ACCOUNT_URL }}
          NEXT_PUBLIC_AZURE_BLOB_SAS_TOKEN: ${{ secrets.NEXT_PUBLIC_AZURE_BLOB_SAS_TOKEN }}
          NEXT_PUBLIC_RAG_API_URL: ${{ secrets.NEXT_PUBLIC_RAG_API_URL }}
        run: npm run build

      # Azure's managed Functions deploy step is currently flaky platform-wide
      # (https://github.com/Azure/static-web-apps/issues/1761, #1689, #1711) —
      # builds succeed and upload fine, but the "Failed to deploy the Azure
      # Functions" polling step intermittently fails. Retry up to 3 times
      # before giving up, since the composite action isn't retryable as a
      # plain shell command.
      - name: Deploy to Azure Static Web Apps (attempt 1)
        id: swa_deploy_1
        uses: Azure/static-web-apps-deploy@v1
        continue-on-error: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_ISLAND_047A61710 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: ${{ github.ref_name == 'storybook' && 'storybook-static' || '/' }}
          api_location: ''
          output_location: ''
          skip_app_build: true
          production_branch: 'main'

      - name: Wait before retry
        if: steps.swa_deploy_1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Azure Static Web Apps (attempt 2)
        id: swa_deploy_2
        if: steps.swa_deploy_1.outcome == 'failure'
        uses: Azure/static-web-apps-deploy@v1
        continue-on-error: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_ISLAND_047A61710 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: ${{ github.ref_name == 'storybook' && 'storybook-static' || '/' }}
          api_location: ''
          output_location: ''
          skip_app_build: true
          production_branch: 'main'

      - name: Wait before retry
        if: steps.swa_deploy_1.outcome == 'failure' && steps.swa_deploy_2.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Azure Static Web Apps (attempt 3)
        id: swa_deploy_3
        if: steps.swa_deploy_1.outcome == 'failure' && steps.swa_deploy_2.outcome == 'failure'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_ISLAND_047A61710 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: ${{ github.ref_name == 'storybook' && 'storybook-static' || '/' }}
          api_location: ''
          output_location: ''
          skip_app_build: true
          production_branch: 'main'

  # ── Close PR preview ─────────────────────────────────────
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR Preview

    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_ISLAND_047A61710 }}
          action: 'close'
          app_location: '/'
